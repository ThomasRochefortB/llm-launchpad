name: Bug report
description: Report a problem with the CLI, TUI, or a provider integration.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please run
        `llm-launchpad doctor` and include its output below along with a
        redacted tail of `~/.llm_launchpad/logs/llm_launchpad.log`. Never paste
        API keys or bearer tokens.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
      placeholder: Deploying ... failed with ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - TUI
        - CLI command
        - Modal provider
        - Prime Intellect provider
        - llama.cpp backend
        - vLLM backend
        - OpenCode integration
        - Packaging / install
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: llm-launchpad version
      description: Output of `llm-launchpad --version`.
      placeholder: 1.1.1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `llm-launchpad doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted debug log tail
      description: Last ~50 lines of `~/.llm_launchpad/logs/llm_launchpad.log`, with any sensitive values removed.
      render: text
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `llm-launchpad ...`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true

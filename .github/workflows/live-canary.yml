name: Live canary

# Deploys the smallest model on each provider, sends one chat request through
# warmup, and stops it (scripts/canary_live.py). It exists because regressions
# in generated startup scripts pass every offline test; see the script's
# docstring. Costs cents per run. Providers without secrets are skipped.
#
# Secrets (any subset): MODAL_TOKEN_ID + MODAL_TOKEN_SECRET, PRIME_API_KEY,
# VAST_API_KEY, HF_TOKEN.

on:
  schedule:
    - cron: "17 7 * * 1"  # Mondays 07:17 UTC
  workflow_dispatch:
    inputs:
      provider:
        description: "One provider, or all providers"
        required: false
        default: "all"
        type: choice
        options: [all, modal, prime, vast]

concurrency:
  group: live-canary
  cancel-in-progress: false  # never abandon a run that holds a rental

jobs:
  canary:
    name: Deploy, chat, stop
    if: github.repository == 'ThomasRochefortB/llm-launchpad'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    env:
      CANARY_PROVIDER: ${{ inputs.provider }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: "pyproject.toml"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run canary
        id: canary
        run: |
          args=(--live --report canary-report.json)
          if [ -n "$CANARY_PROVIDER" ] && [ "$CANARY_PROVIDER" != all ]; then
            args+=(--provider "$CANARY_PROVIDER")
          fi
          uv run python scripts/canary_live.py "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canary-report
          path: canary-report.json
          if-no-files-found: ignore

      - name: Open or update the canary issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let summary = 'The report was not written.';
            try {
              const report = JSON.parse(fs.readFileSync('canary-report.json', 'utf8'));
              summary = report.results
                .map(r => `- **${r.provider}**: ${r.status}${r.detail ? ` (${r.detail})` : ''}`)
                .join('\n');
            } catch (error) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The weekly live canary failed.\n\n${summary}\n\nRun and report: ${run}`;
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'canary',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'Live canary failing', body, labels: ['canary'],
              });
            }

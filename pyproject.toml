[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-launchpad"
version = "0.0.2"
description = "Personal LLM deployments made simple."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Rochefort-Beaudoin" }]
keywords = ["llm", "deployment", "modal", "agent", "chat"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
]

# Minimal runtime dependencies for using the Modal application entrypoints
dependencies = [
  "modal>=1.3.3",
  "coolname>=2.2.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "textual>=3.0.0",
  "requests>=2.32.0",
  "huggingface_hub>=0.26.2",
]

[project.scripts]
llm-launchpad = "llm_launchpad.cli.main:main"

[project.urls]
Homepage = "https://github.com/ThomasRochefortB/llm-launchpad"
Issues = "https://github.com/ThomasRochefortB/llm-launchpad/issues"

[tool.setuptools]
packages = ["llm_launchpad", "llm_launchpad.backends", "llm_launchpad.cli", "llm_launchpad.core", "llm_launchpad.protocol", "llm_launchpad.tui", "llm_launchpad.tui.screens", "llm_launchpad.tui.widgets"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

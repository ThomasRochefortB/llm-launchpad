[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-launchpad"
dynamic = ["version"]
description = "Personal LLM deployments made simple."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Rochefort-Beaudoin" }]
maintainers = [{ name = "Thomas Rochefort-Beaudoin", email = "ThomasRochefortB@users.noreply.github.com" }]
keywords = ["llm", "deployment", "modal", "agent", "chat"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

# Minimal runtime dependencies for using the Modal application entrypoints
dependencies = [
  "modal>=1.3.3",
  "coolname>=2.2.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "textual>=3.0.0",
  "requests>=2.32.0",
  "huggingface_hub>=0.26.2",
]

[project.optional-dependencies]
benchmark = [
  "aiperf>=0.7,<0.13",
]

[project.scripts]
llm-launchpad = "llm_launchpad.cli.main:main"
modal = "modal.__main__:main"

[project.urls]
Homepage = "https://github.com/ThomasRochefortB/llm-launchpad"
Documentation = "https://github.com/ThomasRochefortB/llm-launchpad#readme"
Repository = "https://github.com/ThomasRochefortB/llm-launchpad"
Issues = "https://github.com/ThomasRochefortB/llm-launchpad/issues"
Changelog = "https://github.com/ThomasRochefortB/llm-launchpad/blob/main/CHANGELOG.md"
Security = "https://github.com/ThomasRochefortB/llm-launchpad/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["llm_launchpad", "llm_launchpad.backends", "llm_launchpad.cli", "llm_launchpad.core", "llm_launchpad.data", "llm_launchpad.protocol", "llm_launchpad.tui", "llm_launchpad.tui.screens", "llm_launchpad.tui.widgets"]

[tool.setuptools.dynamic]
version = { attr = "llm_launchpad._version.__version__" }

[tool.setuptools.package-data]
"llm_launchpad.tui" = ["theme.tcss"]
"llm_launchpad.data" = ["*.json"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["llm_launchpad", "tests/smoke_test.py", "tests/test_release_metadata.py"]
exclude = [
    "llm_launchpad/backends",
    "llm_launchpad/tui",
    "llm_launchpad/core/hf_models.py",
]
